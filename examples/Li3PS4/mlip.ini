mtp-filename                    ./trained.mtp
select                          FALSE                    # <bool>        Activates/deactivates selection (active learning)
  select:threshold                2.0                   # <double>      Selection threshold - maximum allowed extrapolation grade
  select:threshold-break          10.0                  # <double>      Break the program if this threshold exceeded. Should be >1.0. If activated updates of selected set are restricted
  select:save-selected            B-preselected.cfg     # <string>      Selected configurations will be saved in this file after selection is complete. No configuration saving if not specified
  select:load-state               A-state.als           # <string>      Active learning state will be loaded from this file before selection starts. Used to continue selection/learning on the fly

# SOME DEFAULT PARAMETERS, unlikely to be changed:
  select:threshold-init           1e-5                  # <double>      Parameter for initiating selecting process
  select:threshold-swap           1.000001              # <double>      Treshold for the following swaps if Selection threshold is reached    
